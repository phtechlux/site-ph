<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8" />
<title>Painel de Leads</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #eef0f6;
    --surface: #fafafc;
    --surface-2: #ffffff;
    --ink: #14152b;
    --ink-dim: #52536b;
    --line: #d9dae7;
    --accent: #33409e;
    --accent-ink: #ffffff;
    --accent-bg: #e3e6f7;
    --amber: #9a6414;
    --amber-bg: #f8ecd4;
    --blue: #29538f;
    --blue-bg: #dde7f6;
    --green: #276b45;
    --green-bg: #dcefe3;
    --grey: #5c5d70;
    --grey-bg: #e6e6ee;
    --shadow: 0 1px 2px rgba(20, 21, 43, 0.06), 0 4px 14px rgba(20, 21, 43, 0.07);
    --radius: 3px;
    --font-mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, "Roboto Mono", monospace;
    --font-body: Seravek, "Gill Sans Nova", Corbel, "Segoe UI", Calibri, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12121f;
      --surface: #191a2c;
      --surface-2: #1f2036;
      --ink: #edeef7;
      --ink-dim: #a4a6c2;
      --line: #35364e;
      --accent: #7c89e0;
      --accent-ink: #12121f;
      --accent-bg: #262a4a;
      --amber: #e0b158;
      --amber-bg: #3a2f16;
      --blue: #86aeeb;
      --blue-bg: #1c2a41;
      --green: #7cd1a0;
      --green-bg: #163829;
      --grey: #b3b4cc;
      --grey-bg: #2a2b40;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.35);
    }
  }

  :root[data-theme="dark"] {
    --bg: #12121f;
    --surface: #191a2c;
    --surface-2: #1f2036;
    --ink: #edeef7;
    --ink-dim: #a4a6c2;
    --line: #35364e;
    --accent: #7c89e0;
    --accent-ink: #12121f;
    --accent-bg: #262a4a;
    --amber: #e0b158;
    --amber-bg: #3a2f16;
    --blue: #86aeeb;
    --blue-bg: #1c2a41;
    --green: #7cd1a0;
    --green-bg: #163829;
    --grey: #b3b4cc;
    --grey-bg: #2a2b40;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    margin: 0;
    -webkit-font-smoothing: antialiased;
  }

  body { min-height: 100vh; }

  a { color: inherit; }

  .wrap {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px 16px 64px;
  }

  /* ---------- login ---------- */

  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  /* [hidden] do navegador some, mas CSS de autor (display:flex acima) tem
     prioridade sobre o CSS padrão do user-agent — sem isso o atributo
     "hidden" era setado no JS mas a tela de login continuava visível. */
  .login-screen[hidden] {
    display: none;
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 32px 28px;
    width: 100%;
    max-width: 360px;
  }
  .login-card .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 0 0 4px;
  }
  .login-card h1 {
    font-family: var(--font-mono);
    font-size: 1.3rem;
    margin: 0 0 22px;
  }
  .login-card .campo { margin-bottom: 14px; }
  .login-card label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    margin-bottom: 5px;
  }
  .login-card .btn.primary { width: 100%; justify-content: center; margin-top: 6px; }
  .login-erro {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 6px;
    padding: 8px 11px;
    font-size: 0.8rem;
    margin-bottom: 14px;
  }
  .login-loading {
    text-align: center;
    padding: 40px;
    color: var(--ink-dim);
    font-family: var(--font-mono);
    font-size: 0.85rem;
  }

  /* ---------- header ---------- */

  header.top {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 18px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }

  .title-block .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 0 0 4px;
  }

  .title-block h1 {
    font-family: var(--font-mono);
    font-size: clamp(1.35rem, 2.4vw, 1.7rem);
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .header-right {
    display: flex;
    align-items: flex-end;
    gap: 22px;
    flex-wrap: wrap;
  }

  .stats {
    display: flex;
    gap: 22px;
    flex-wrap: wrap;
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 64px;
  }

  .stat .num {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 1.35rem;
    font-weight: 600;
    line-height: 1;
  }

  .stat .lbl {
    font-size: 0.68rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 18px;
  }

  @media (max-width: 600px) {
    .wrap { padding: 12px 12px 40px; }
    header.top { padding-bottom: 10px; margin-bottom: 10px; gap: 8px; }
    .title-block .eyebrow { font-size: 0.62rem; margin-bottom: 2px; }
    .title-block h1 { font-size: 1.15rem; }
    .header-right { gap: 12px; }
    .stats { gap: 12px; }
    .stat { min-width: auto; }
    .stat .num { font-size: 1.05rem; }
    .stat .lbl { font-size: 0.6rem; }
    .toolbar { margin-bottom: 10px; gap: 6px; }
    .board {
      grid-auto-flow: row;
      grid-auto-columns: unset;
      grid-template-columns: 1fr;
      overflow-x: hidden;
    }
    .col { max-height: none; }
    .col-body { max-height: 60vh; }
  }

  .toolbar input[type="search"] {
    flex: 1 1 200px;
    min-width: 160px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 9px 12px;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 0.9rem;
  }
  .toolbar input[type="search"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  button {
    font-family: var(--font-body);
    font-size: 0.85rem;
    cursor: pointer;
  }
  button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  input[type="email"], input[type="password"] {
    width: 100%;
    font-family: var(--font-body);
    font-size: 0.9rem;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 9px 10px;
  }

  .btn {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 13px;
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
    font-weight: 600;
  }
  .btn.primary:hover { opacity: 0.92; }
  .btn.primary:disabled { opacity: 0.6; cursor: default; }
  .btn.ghost { background: transparent; }
  .btn.small { padding: 5px 9px; font-size: 0.76rem; }
  .btn.danger { color: #b3435a; border-color: #b3435a44; }

  /* ---------- board ---------- */

  .board {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(268px, 1fr);
    gap: 14px;
    overflow-x: auto;
    padding-bottom: 8px;
  }

  .col {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    min-height: 200px;
    max-height: calc(100vh - 220px);
  }

  .col-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 14px;
    border-bottom: 1px dashed var(--line);
    position: sticky;
    top: 0;
    background: var(--surface);
    border-radius: 6px 6px 0 0;
  }

  .col-head .name {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  .col-head .count {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 0.72rem;
    color: var(--ink-dim);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1px 7px;
  }

  .col[data-stage="novo"] .col-head .name { color: var(--accent); }
  .col[data-stage="enviado"] .col-head .name { color: var(--amber); }
  .col[data-stage="respondeu"] .col-head .name { color: var(--blue); }
  .col[data-stage="fechado"] .col-head .name { color: var(--green); }
  .col[data-stage="arquivado"] .col-head .name { color: var(--grey); }

  .col-body {
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    overflow-y: auto;
  }

  .empty-hint {
    font-size: 0.78rem;
    color: var(--ink-dim);
    padding: 14px 6px;
    text-align: center;
  }

  /* ticket card, torn-stub motif */
  .card {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 11px 12px 10px;
    cursor: pointer;
    box-shadow: var(--shadow);
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .card::before {
    content: "";
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: -1px;
    border-bottom: 1px dashed var(--line);
  }
  .card:hover { border-color: var(--accent); }

  .card-top {
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }

  .card-icon {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--bg);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-icon svg { width: 15px; height: 15px; stroke: var(--ink-dim); fill: none; }

  .card-name {
    font-weight: 700;
    font-size: 0.92rem;
    line-height: 1.25;
    text-wrap: balance;
  }
  .card-cat {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .origin-tag {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    letter-spacing: 0.04em;
    padding: 1px 5px;
    border-radius: 8px;
    background: var(--accent-bg);
    color: var(--accent);
  }

  .card-resumo {
    font-size: 0.8rem;
    color: var(--ink-dim);
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-top: 2px;
  }

  .card-days {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }

  .card-foot select {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    background: var(--bg);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 3px 6px;
  }

  /* ---------- modal ---------- */

  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 20, 0.45);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 4vh 14px;
    overflow-y: auto;
    z-index: 40;
  }
  .backdrop[hidden] { display: none; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    width: 100%;
    max-width: 560px;
    box-shadow: var(--shadow);
    padding: 22px 22px 20px;
  }

  .modal-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 14px;
  }

  .modal-head h2 {
    font-family: var(--font-mono);
    font-size: 1.1rem;
    margin: 0 0 3px;
  }
  .modal-head .cat {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--ink-dim);
    text-transform: uppercase;
  }

  .x-close {
    background: transparent;
    border: none;
    color: var(--ink-dim);
    font-size: 1.3rem;
    line-height: 1;
    padding: 2px 6px;
  }

  .field-label {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-dim);
    display: block;
    margin: 14px 0 5px;
  }
  .field-label:first-of-type { margin-top: 0; }

  .msg-box {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px 12px;
    font-size: 0.85rem;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  textarea, input[type="text"], input[type="tel"] {
    width: 100%;
    font-family: var(--font-body);
    font-size: 0.87rem;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 9px 10px;
    resize: vertical;
  }

  .modal-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .modal-row > div { flex: 1 1 160px; }

  .modal-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
    flex-wrap: wrap;
  }

  .status-pill {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 3px 9px;
    border-radius: 10px;
    font-weight: 600;
  }
  .status-pill[data-s="novo"] { background: var(--accent-bg); color: var(--accent); }
  .status-pill[data-s="enviado"] { background: var(--amber-bg); color: var(--amber); }
  .status-pill[data-s="respondeu"] { background: var(--blue-bg); color: var(--blue); }
  .status-pill[data-s="fechado"] { background: var(--green-bg); color: var(--green); }
  .status-pill[data-s="arquivado"] { background: var(--grey-bg); color: var(--grey); }

  footer.page {
    text-align: center;
    color: var(--ink-dim);
    font-size: 0.72rem;
    padding-top: 30px;
    font-family: var(--font-mono);
  }

  .toast {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--bg);
    padding: 9px 16px;
    border-radius: 20px;
    font-size: 0.82rem;
    box-shadow: var(--shadow);
    z-index: 60;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .toast.show { opacity: 1; }
</style>

<div class="login-loading" id="loading-screen">carregando…</div>

<div class="login-screen" id="login-screen" role="main" hidden>
  <div class="login-card">
    <p class="eyebrow">PhOS &middot; painel de leads</p>
    <h1>Entrar</h1>
    <form id="login-form">
      <div id="login-erro-box"></div>
      <div class="campo">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" required autocomplete="username" />
      </div>
      <div class="campo">
        <label for="login-senha">Senha</label>
        <input type="password" id="login-senha" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn primary" id="login-btn">Entrar</button>
    </form>
  </div>
</div>

<div class="wrap" id="app-wrap" hidden>
  <header class="top">
    <div class="title-block">
      <p class="eyebrow">Pedro Henrique &middot; prospecção de sites</p>
      <h1>Painel de leads</h1>
    </div>
    <div class="header-right">
      <div class="stats" id="stats"></div>
      <button class="btn small ghost" id="btn-logout">Sair</button>
    </div>
  </header>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Buscar por nome ou categoria…" />
    <button class="btn primary" id="btn-new">+ Novo lead</button>
    <button class="btn" id="btn-export">Exportar backup</button>
  </div>

  <div class="board" id="board"></div>

  <footer class="page">dados salvos no Supabase &middot; só você (logado) consegue ver</footer>
</div>

<div class="backdrop" id="detail-backdrop" hidden>
  <div class="modal" id="detail-modal"></div>
</div>

<div class="backdrop" id="new-backdrop" hidden>
  <div class="modal">
    <div class="modal-head">
      <div>
        <h2>Novo lead</h2>
        <p class="cat">adicionar ao painel</p>
      </div>
      <button class="x-close" data-close-new aria-label="Fechar">&times;</button>
    </div>
    <form id="new-form">
      <label class="field-label" for="f-nome">Nome do negócio</label>
      <input type="text" id="f-nome" required />

      <div class="modal-row">
        <div>
          <label class="field-label" for="f-cat">Categoria</label>
          <input type="text" id="f-cat" placeholder="ex: Piscinas, Beleza, Informática" />
        </div>
        <div>
          <label class="field-label" for="f-contato-tipo">Contato</label>
          <select id="f-contato-tipo">
            <option value="whatsapp">WhatsApp</option>
            <option value="instagram">Instagram</option>
          </select>
        </div>
      </div>

      <label class="field-label" for="f-contato-valor">Número (só dígitos, com DDI 55) ou @usuário</label>
      <input type="text" id="f-contato-valor" placeholder="5561999999999" />

      <label class="field-label" for="f-resumo">Resumo do negócio</label>
      <textarea id="f-resumo" rows="2"></textarea>

      <label class="field-label" for="f-msg">Mensagem enviada</label>
      <textarea id="f-msg" rows="4"></textarea>

      <div class="modal-actions">
        <span></span>
        <button type="submit" class="btn primary">Adicionar lead</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/painel/supabase.js"></script>
<script type="module" src="/painel/app.js"></script>
